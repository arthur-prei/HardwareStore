<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Peças - Hardware Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-area">
        <span class="icon">⚙️</span>
        <div>
          <h1>Central de Peças</h1>
          <p class="subtitle">Gerenciamento de estoque e componentes de hardware</p>
        </div>
      </div>
    </header>

    <!-- Mensagens de alerta/feedback -->
    <div id="alert-container" class="alert-container" aria-live="polite"></div>

    <main class="main-content">
      <!-- Formulário de cadastro / edição -->
      <section class="card form-card">
        <h2 id="form-title">Cadastrar Nova Peça</h2>
        <form id="item-form" autocomplete="off">
          <input type="hidden" id="item-id">
          
          <div class="form-group">
            <label for="item-name">Nome da Peça</label>
            <input 
              type="text" 
              id="item-name" 
              name="name" 
              placeholder="Ex: NVIDIA RTX 4060, Memória RAM 16GB" 
              required 
              maxlength="100"
            >
          </div>

          <div class="form-group">
            <label for="item-price">Preço (R$)</label>
            <input 
              type="number" 
              id="item-price" 
              name="price" 
              placeholder="Ex: 1499.90" 
              step="0.01" 
              min="0" 
              required
            >
          </div>

          <div class="form-actions">
            <button type="submit" id="btn-submit" class="btn btn-primary">
              <span id="btn-submit-text">Cadastrar Peça</span>
            </button>
            <button type="button" id="btn-cancel" class="btn btn-secondary" style="display: none;">
              Cancelar
            </button>
          </div>
        </form>
      </section>

      <!-- Lista / Tabela de Peças -->
      <section class="card list-card">
        <div class="list-header">
          <h2>Peças Disponíveis</h2>
          <button id="btn-refresh" class="btn btn-outline" title="Atualizar Lista">
            🔄 Atualizar
          </button>
        </div>

        <!-- Indicador de carregamento -->
        <div id="loading" class="state-message" style="display: none;">
          <div class="spinner"></div>
          <p>Carregando peças...</p>
        </div>

        <!-- Mensagem de lista vazia -->
        <div id="empty-state" class="state-message" style="display: none;">
          <p>📦 Nenhuma peça cadastrada no momento.</p>
        </div>

        <!-- Tabela -->
        <div class="table-responsive">
          <table id="items-table" class="items-table" style="display: none;">
            <thead>
              <tr>
                <th style="width: 80px;">ID</th>
                <th>Nome</th>
                <th style="width: 140px;">Preço</th>
                <th style="width: 160px; text-align: center;">Ações</th>
              </tr>
            </thead>
            <tbody id="items-tbody">
              <!-- Preenchido via app.js -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Hardware Store API &bull; Central de Peças &bull; ASP.NET Core &amp; SQLite</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
